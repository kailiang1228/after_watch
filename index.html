<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待看清單</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><i class="fas fa-film"></i> 待看清單</h1>
        
        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-number" id="total-count">0</span>
                <span class="stat-label">總計</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="watched-count">0</span>
                <span class="stat-label">已看</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="remaining-count">0</span>
                <span class="stat-label">待看</span>
            </div>
        </div>

        <div class="controls-container">
            <div class="input-group">
                <select id="category-select">
                    <option value="">選擇類別</option>
                    <option value="movie">電影</option>
                    <option value="drama">劇集</option>
                    <option value="animation">動畫</option>
                </select>
                <input type="text" id="new-item-title" placeholder="輸入標題...">
                <button id="addItem"><i class="fas fa-plus"></i> 新增</button>
            </div>
            
            <div class="search-group">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="搜尋片單...">
            </div>

            <div class="action-buttons">
                <button id="exportList" class="btn-secondary"><i class="fas fa-download"></i> 備份</button>
                <button id="importList" class="btn-secondary"><i class="fas fa-upload"></i> 讀取</button>
                <button id="resetItems" class="btn-danger"><i class="fas fa-trash-alt"></i> 重置</button>
                <input type="file" id="importFile" style="display: none;">
            </div>
        </div>
    </header>

    <main>
        <section id="movies" class="category-section">
            <h2><i class="fas fa-video"></i> 電影</h2>
            <div id="movie-list" class="item-list"></div>
        </section>

        <section id="dramas" class="category-section">
            <h2><i class="fas fa-tv"></i> 劇集</h2>
            <div id="drama-list" class="item-list"></div>
        </section>

        <section id="animations" class="category-section">
            <h2><i class="fas fa-dragon"></i> 動畫</h2>
            <div id="animation-list" class="item-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
